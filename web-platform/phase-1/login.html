<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Cartogen AI</title>
<style>
:root{--bg:#101719;--panel:#172224;--panel2:#1e2d2e;--line:#304344;--text:#e8f0ee;--muted:#9aacab;--accent:#40c7a2;--warn:#e6b85c;--danger:#e27676}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
button,input{font:inherit}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.brand{font-weight:800;letter-spacing:.3px;margin-bottom:2px}
.brand b{color:var(--accent)}
h1{font-size:19px;margin:14px 0 4px}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
.tabs{display:flex;gap:6px;margin:16px 0 14px;border-bottom:1px solid var(--line)}
.tab{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 4px;font-weight:700;cursor:pointer}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
label{display:block;color:var(--muted);font-size:11px;margin:12px 0 5px}
.input{width:100%;background:#10191b;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.input:focus{outline:none;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;margin-top:18px;border:1px solid var(--accent);background:var(--accent);color:#08201a;border-radius:8px;padding:10px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.notice{display:none;margin-top:12px;padding:9px 10px;border-radius:8px;font-size:12px;line-height:1.4}
.notice.show{display:block}
.notice.error{background:rgba(226,118,118,.12);color:var(--danger);border:1px solid rgba(226,118,118,.35)}
.notice.ok{background:rgba(64,199,162,.12);color:var(--accent);border:1px solid rgba(64,199,162,.35)}
.demo-note{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.demo-note .btn{background:transparent;color:var(--text);border-color:var(--line)}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><b>Cartogen AI</b> Workspace</div>
  <h1 id="heading">Sign in</h1>
  <div class="muted" id="subheading">Use your Cartogen AI account to continue.</div>
  <div class="tabs">
    <button class="tab active" type="button" data-tab="login">Sign in</button>
    <button class="tab" type="button" data-tab="register">Create account</button>
  </div>
  <form id="form">
    <div id="nameFields" hidden>
      <div class="row2">
        <div><label for="firstName">First name</label><input class="input" id="firstName" autocomplete="given-name"></div>
        <div><label for="lastName">Last name</label><input class="input" id="lastName" autocomplete="family-name"></div>
      </div>
    </div>
    <label for="email">Email</label>
    <input class="input" id="email" type="email" required autocomplete="email">
    <label for="password">Password</label>
    <input class="input" id="password" type="password" required autocomplete="current-password">
    <div class="muted" id="passwordHint" style="margin-top:5px" hidden>At least 12 characters.</div>
    <button class="btn" type="submit" id="submitButton">Sign in</button>
    <div class="notice" id="notice" aria-live="polite"></div>
  </form>
  <div class="demo-note" id="demoNote" hidden>
    <div class="muted">This deployment is running in demo identity mode — Directus sign-in isn't required here.</div>
    <button class="btn" type="button" id="continueDemoButton">Continue to workspace</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let mode = 'login';

function setMode(next) {
  mode = next;
  document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === next));
  $('nameFields').hidden = next !== 'register';
  $('passwordHint').hidden = next !== 'register';
  $('password').setAttribute('autocomplete', next === 'register' ? 'new-password' : 'current-password');
  $('heading').textContent = next === 'register' ? 'Create your account' : 'Sign in';
  $('subheading').textContent = next === 'register' ? 'Set up a Cartogen AI account for your organization.' : 'Use your Cartogen AI account to continue.';
  $('submitButton').textContent = next === 'register' ? 'Create account' : 'Sign in';
  $('notice').className = 'notice';
}

document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => setMode(tab.dataset.tab)));

function notice(text, kind) { $('notice').textContent = text; $('notice').className = `notice show ${kind || ''}`; }

async function checkMode() {
  try {
    const response = await fetch('/api/auth/status');
    const data = await response.json();
    if (data.mode !== 'directus') {
      $('demoNote').hidden = false;
      $('form').style.opacity = '.45';
      $('form').style.pointerEvents = 'none';
    }
  } catch {}
}
checkMode();

$('continueDemoButton')?.addEventListener('click', () => { window.location.href = '/welcome.html'; });

$('form').addEventListener('submit', async event => {
  event.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) return notice('Enter an email and password.', 'error');
  $('submitButton').disabled = true;
  notice(mode === 'register' ? 'Creating your account…' : 'Signing in…', '');
  try {
    if (mode === 'register') {
      if (password.length < 12) throw new Error('Password must be at least 12 characters.');
      const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email, password, first_name: $('firstName').value.trim(), last_name: $('lastName').value.trim() }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Registration failed.');
      if (data.verification_required) {
        notice(data.message || 'Registration succeeded. Sign in once your account is activated.', 'ok');
        setMode('login');
        $('submitButton').disabled = false;
        return;
      }
    } else {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Sign-in failed.');
    }
    window.location.href = '/welcome.html';
  } catch (error) {
    notice(error.message, 'error');
    $('submitButton').disabled = false;
  }
});
</script>
</body>
</html>
