services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: cartogen_phase1
      POSTGRES_USER: cartogen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in web-platform/phase-1/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - phase1_postgis_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartogen -d cartogen_phase1"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  phase1_postgis_data:
