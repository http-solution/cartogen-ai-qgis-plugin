<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Cartogen AI</title><style>body{font:16px system-ui;max-width:480px;margin:5rem auto;padding:0 1rem;color:#0b2a3d}form{display:grid;gap:.8rem}input,button{padding:.8rem;border:1px solid #ccd6dc;border-radius:.5rem;font:inherit}button{background:#0b2a3d;color:white;cursor:pointer}.muted{color:#5d6b73}#message{min-height:1.5rem;color:#a33}</style></head>
<body>
<h1>Cartogen AI</h1><p class="muted">Sign in to manage your Cartogen AI service access.</p>
<form id="login"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<p id="message"></p><p class="muted">New here? <a href="/register.html">Create an account</a>.</p>
<script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(r.ok)location='/portal.html';else if(r.status===401)document.querySelector('#message').textContent='Sign-in was rejected. If this email was registered more than once, use the password from the first successful registration or ask an administrator to reset the account in Directus.';else document.querySelector('#message').textContent=d.error||'Sign-in failed';});</script>
</body></html>
