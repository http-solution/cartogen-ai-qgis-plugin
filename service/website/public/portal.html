<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartogen AI portal</title><style>body{font:16px system-ui;max-width:760px;margin:4rem auto;padding:0 1rem;color:#0b2a3d}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dde5e8;padding-bottom:1rem}.card{border:1px solid #d8e1e5;border-radius:.75rem;padding:1.25rem;margin-top:1.5rem}button{padding:.65rem 1rem;border:0;border-radius:.45rem;background:#0b2a3d;color:white;cursor:pointer}.muted{color:#5d6b73}#error{color:#a33}</style></head>
<body><header><h1>Cartogen AI portal</h1><button id="logout">Sign out</button></header><section class="card"><h2 id="welcome">Loading account…</h2><p class="muted">This portal foundation is connected to Directus authentication. Billing and service entitlement appear here after checkout is configured.</p><button id="subscribe">Continue to subscription checkout</button><p id="error"></p></section>
<script>async function load(){const r=await fetch('/api/me');if(!r.ok){location='/login.html';return}const d=await r.json();document.querySelector('#welcome').textContent=`Welcome, ${d.user.first_name||d.user.email||d.user.id}`;}load();document.querySelector('#logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST'});location='/'};document.querySelector('#subscribe').onclick=async()=>{const r=await fetch('/create-checkout-session',{method:'POST'});const d=await r.json();if(d.url)location=d.url;else document.querySelector('#error').textContent=d.error||'Checkout is not configured yet.'};</script>
</body></html>
