services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cartogen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cartogen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cartogen} -d ${POSTGRES_DB:-cartogen}"]
      interval: 5s
      timeout: 5s
      retries: 20

  directus:
    image: ${DIRECTUS_IMAGE:-directus/directus@sha256:eb326f679ae847c0a776f93b972761dc2ebe84980e0b9d274a6bc31cd62809f7}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIRECTUS_PORT:-8055}:8055"
    environment:
      KEY: ${DIRECTUS_KEY:?set DIRECTUS_KEY in .env}
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET in .env}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?set DIRECTUS_ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD in .env}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: ${POSTGRES_USER:-cartogen}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      USER_REGISTRATION: ${DIRECTUS_USER_REGISTRATION:-false}
      USER_REGISTER_ROLE: ${DIRECTUS_REGISTER_ROLE:-}
      WEBSOCKETS_ENABLED: "true"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm@sha256:8386035f69266617cb88f35380a78e81a66e047a52821c73713666247ff2aba0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cartogen}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./gateway/litellm_config.yaml:/app/config.yaml:ro

  website:
    build:
      context: ./website
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      directus:
        condition: service_started
      litellm:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cartogen}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cartogen}
      DIRECTUS_URL: http://directus:8055
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-3000}:3000"

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
