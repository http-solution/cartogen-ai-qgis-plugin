<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{BASE}}assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{BASE}}assets/style.css">
<script>try{var t=localStorage.getItem("cg-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-base="{{BASE}}">
<a class="skip" href="#content">Skip to content</a>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="brand" href="{{BASE}}index.html"><img src="{{BASE}}assets/mark.svg" width="30" height="30" alt=""> Cartogen AI <small>docs · {{VERSION}}</small></a>
  <span class="spacer"></span>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Search the docs  ( / )" autocomplete="off" aria-label="Search the documentation">
    <div class="results" id="results"></div>
  </div>
  <a class="icon-btn" href="{{GITHUB}}" aria-label="GitHub repository" title="GitHub"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
  <button class="icon-btn" id="theme-btn" aria-label="Switch light or dark theme" title="Theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.800 9.800z"/></svg></button>
</header>
<div class="layout">
  <nav class="sidebar" aria-label="Documentation sections">{{NAV}}</nav>
  <main id="content">
    <article class="doc{{WIDE}}">
      {{CRUMBS}}
      {{BODY}}
    </article>
    {{PAGER}}
  </main>
  {{TOC}}
</div>
<footer>Cartogen AI community edition · GNU GPL v2 · docs built from the repository on {{BUILD_DATE}} for {{VERSION}} · <a href="{{GITHUB}}">GitHub</a> · <a href="{{GITHUB}}/issues">Report a problem</a></footer>
<script src="{{BASE}}assets/site.js"></script>
</body>
</html>
