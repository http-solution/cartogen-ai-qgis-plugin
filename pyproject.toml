[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cartogen-ai-core"
# Kept in sync with metadata.txt's version= by hand for now -- see
# docs/archive/MULTITIER_REPO_ARCHITECTURE_SPEC.md for why there isn't a single
# source of truth between the two yet (metadata.txt is QGIS's own plugin
# manifest format and can't easily read from pyproject.toml at plugin-load
# time; a `python docs/generate_tools_reference.py`-style sync script would
# be the next step if this drifts in practice).
version = "1.18.0"
description = "Cartogen AI Community edition -- spatial AI agent for QGIS"
readme = "README.md"
# SEC-003, 2026-09-14 audit: was "GPL-2.0-or-later", which didn't match either the actual
# shipped LICENSE file (plain GPLv2, no "or any later version" clause applied to this project)
# or metadata.txt's own license= field ("GNU GPL v2"). Corrected to match both -- a metadata
# accuracy fix, not a change to the license terms themselves (which were already GPLv2 per the
# LICENSE file; this SPDX identifier was simply wrong).
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10"
authors = [{ name = "Alaa Alshoubaki" }]

# `requests` is declared because every provider client and account.py import it directly (audit F30, #166), so a standalone wheel install
# must pull it in. qgis.core / qgis.PyQt are deliberately NOT declared: this package normally runs inside a QGIS Python environment that
# provides them, and they are not installable from PyPI. See requirements.txt for the *optional* document-parsing/web-search/imagery
# dependencies, installed separately.
dependencies = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]
# PEP 420 implicit namespace packages: src/cartogen_ai/ has no __init__.py,
# so this repo's build only claims cartogen_ai.core (and its subpackages) --
# it does NOT own the bare `cartogen_ai` namespace itself. A future private
# Pro/Enterprise repo's own pyproject.toml would do the same thing for its
# own cartogen_ai.pro / cartogen_ai.enterprise packages, and pip merges both
# installs into one working `cartogen_ai` namespace with no file conflicts --
# see docs/archive/MULTITIER_REPO_ARCHITECTURE_SPEC.md for the full design.
include = [
    "cartogen_ai.core",
    "cartogen_ai.core.*",
    "cartogen_ai.processing",
    "cartogen_ai.processing.*",
    "cartogen_ai.infrastructure",
    "cartogen_ai.infrastructure.*",
]

[tool.setuptools.package-data]
"cartogen_ai.core" = ["*.md"]
# Runtime JSON the code opens next to itself (task_register.py, schema_contracts.py): without these a built wheel
# imports fine and then fails at first use (audit F30, #166). The QGIS ZIP packages by traversal and was never affected.
"cartogen_ai.core.agent" = ["task_register.json"]
"cartogen_ai.core.validators" = ["contracts/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".idea",
    ".vscode",
    "branding",
    "service",
    "web-platform",
    "_legacy_stubs",
    "_to_delete",
]

[tool.ruff.lint]
# The standard this repository is held to (rc28 audit): pycodestyle, pyflakes, bugbear, comprehensions, simplify, return,
# pie, pylint errors/warnings, ruff-specific, bandit (S), pyupgrade, PEP 8 naming (N), perflint (PERF), builtin shadowing (A),
# implicit string concatenation (ISC), import conventions (ICN) and no print() in shipped code (T20: use core/logger.py).
# Complexity is capped at 25 (McCabe).
select = ["E", "F", "W", "B", "C4", "C90", "SIM", "RET", "PIE", "PLE", "PLW", "RUF", "S", "UP",
          "N", "PERF", "A", "ISC", "ICN", "T20"]
ignore = [
    "E501",     # line length handled flexibly for descriptive strings
    "PERF203",  # try/except per item is deliberate (one bad feature must not abort the batch); Python 3.10 target
]

[tool.ruff.lint.flake8-import-conventions]
# Replaces ruff's default alias table (which newer releases extend with datetime -> dt): `import datetime` is the stdlib's own
# spelling and is used throughout; only the scientific-stack aliases are enforced.
aliases = { numpy = "np", matplotlib = "mpl", "matplotlib.pyplot" = "plt", pandas = "pd", scipy = "sp" }

[tool.ruff.lint.pep8-naming]
# Names that are dictated by Qt, QGIS or the `requests` API and cannot follow PEP 8: method overrides called by the framework
# (event handlers, QgsProcessingAlgorithm and provider hooks, QgsTask/feedback callbacks), Qt signal attributes, the
# pyqtSignal/pyqtSlot fallback stubs used when Qt is absent, and the requests exception names mirrored by the offline stubs.
extend-ignore-names = [
    "classFactory", "initGui", "initProcessing", "unload",
    "currentThread", "setValue", "pyqtSignal", "pyqtSlot", "reportError", "isCanceled", "keyPressEvent", "resizeEvent",
    "createInstance", "displayName", "groupId", "shortHelpString", "initAlgorithm", "processAlgorithm", "longName",
    "loadAlgorithms", "fatalError",
    "sendRequested", "receiveMessageSignal", "statusSignal", "usageSignal", "planUpdatedSignal", "toolStepSignal",
    "refinementFetchedSignal", "modelsFetchedSignal",
    "RequestException", "ConnectionError_", "Timeout_",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# Tests assert, write to fake /tmp paths, use seeded random data, build SQL strings to feed the read-only guard, and call
# subprocess/urllib against local servers: the security rules (S) are for shipped code, not for test code. Fakes mirror the
# Qt/QGIS camelCase API and unittest's setUp names, print from CI helper scripts, and import numpy lazily under its own name.
# The slope/intercept regression in raster_tools.py uses the textbook X/Y and s-prefixed sums-of-products names.
"src/cartogen_ai/core/agent/tools/raster_tools.py" = ["N806"]
"__init__.py" = ["N999", "T201"]  # runs before the package is importable, so it cannot use core/logger.py; folder name is the repo's
"docs/**" = ["T201", "N803", "N806"]  # command-line helper scripts and a prototype that print their results
"tools/**" = ["T201"]
"site/build.py" = ["T201"]  # command-line docs builder
"plugin_upload.py" = ["T201"]  # command-line release builder
"src/cartogen_ai/core/logger.py" = ["T201"]  # the stdout/stderr fallback sink when QgsMessageLog is unavailable
"tests/**" = ["N802", "A002", "A006", "T201", "ICN001", "PERF102", "S101", "S108", "S310", "S311", "S603", "S608"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["cartogen_ai"]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = [
    "branding",
    "service",
    "web-platform",
    "_legacy_stubs",
    "_to_delete",
]

