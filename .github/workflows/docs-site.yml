# Builds the documentation site (site/build.py) and deploys it to GitHub Pages.
#   * Pull requests that touch the docs or the site: build only, with link validation, so a broken page cannot merge.
#   * Pushes to main (and manual runs): build, then deploy.
# One-time owner setting, which a workflow cannot make for itself: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until that is set the deploy step is skipped with a visible warning instead of failing the run.
name: docs-site

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "*.md"
      - "metadata.txt"
      - "branding/**"
      - "src/cartogen_ai/core/agent/task_register.json"
      - "src/cartogen_ai/core/release_notes.py"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "*.md"
      - "metadata.txt"
      - "branding/**"
      - "src/cartogen_ai/core/agent/task_register.json"
      - "src/cartogen_ai/core/release_notes.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one build dependency
        run: python -m pip install markdown==3.7

      - name: Build the site and validate every internal link and anchor
        run: python site/build.py --check --out _site

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is Pages set up to deploy from Actions?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo "none")
          echo "build_type=$kind"
          if [ "$kind" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not set to deploy from GitHub Actions (build_type=$kind), so nothing was deployed. Set Settings > Pages > Build and deployment > Source to GitHub Actions, then re-run this workflow."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
