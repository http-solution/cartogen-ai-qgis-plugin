name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional dependencies
        # Everything except the heavy imagery-extraction group (torch/ultralytics,
        # see requirements.txt's own comment) -- not needed for the test suite and
        # would slow CI down for no benefit here.
        run: |
          python -m pip install --upgrade pip
          grep -v -E "^ultralytics|^#|^$" requirements.txt | xargs -r pip install

      - name: Run test suite
        # No QGIS installation in CI -- every module degrades gracefully via its
        # own QGIS_AVAILABLE guard (see CONTRIBUTING.md #4), so this is expected
        # to run the full suite outside QGIS, same as local development.
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Byte-compile check
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile
