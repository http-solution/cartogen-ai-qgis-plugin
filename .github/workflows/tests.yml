name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    # GitHub's native secret scanning requires GitHub Advanced Security, which isn't
    # available on this repo (private, no GHAS license) -- confirmed directly via the
    # API (PATCH .../security_and_analysis returned "Secret scanning is not available
    # for this repository", 2026-09-14). gitleaks is a free, open-source equivalent:
    # scans the pushed commit range for common secret patterns (API keys, tokens,
    # private keys, etc.) and fails the build if any are found. No license/account
    # needed for this basic scan-and-fail usage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    # P1 fix, 2026-09-20 audit: this job used to run ubuntu-only. metadata.txt
    # ships to Windows users (this dev environment itself is Windows) and the
    # test suite has already caught real Windows-vs-POSIX path-handling bugs
    # in local runs -- ubuntu-only CI can't catch those before they reach a
    # release. windows-latest added to the matrix; py_compile/ruff/packaging
    # steps below are POSIX-shell (`find`, `grep`, `xargs`), so they're kept
    # ubuntu-only via a per-step `if:` rather than ported to run cross-platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
        include:
          # The declared floor (Python 3.10, following QGIS; audit F32, #168) must be exercised, not just stated.
          - os: ubuntu-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional dependencies
        # Everything except the heavy imagery-extraction group (torch/ultralytics,
        # see requirements.txt's own comment) -- not needed for the test suite and
        # would slow CI down for no benefit here.
        run: |
          python -m pip install --upgrade pip
          grep -v -E "^ultralytics|^#|^$" requirements.txt | xargs -r pip install
        shell: bash

      - name: Run test suite
        # No QGIS installation in this job -- every module degrades gracefully via
        # its own QGIS_AVAILABLE guard (see CONTRIBUTING.md #4), so this is expected
        # to run the full suite outside QGIS, same as local development. Real QGIS
        # coverage lives in the separate qgis-live-tests job below -- QGIS 4.2.2 only
        # since 2026-09-24, when QGIS 3.x support was dropped (it used to also run the
        # 3.28 LTR floor).
        # -t . is required: without an explicit top-level directory, discover()
        # treats -s tests as its own top level and never runs tests/__init__.py's
        # src/-on-sys.path bootstrap, so every cartogen_ai.core.* import fails --
        # see docs/BUG_TRACKER.md BUG-2026-08-21-7.
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v

      - name: Byte-compile check
        if: runner.os == 'Linux'
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile

      - name: Lint with Ruff
        if: runner.os == 'Linux'
        run: |
          pip install ruff
          ruff check .

      - name: Verify release zip packaging
        if: runner.os == 'Linux'
        run: |
          python plugin_upload.py
          test -f cartogen_ai.zip
          test -f dist/cartogen_ai_v*.zip
          python -c "import zipfile, os; z = zipfile.ZipFile('cartogen_ai.zip'); names = z.namelist(); assert any('cartogen-ai/metadata.txt' in n for n in names); assert any('cartogen-ai/src/cartogen_ai/core/agent/agent_orchestrator.py' in n for n in names); size_mb = os.path.getsize('cartogen_ai.zip') / (1024*1024); assert size_mb < 20.0, f'Package exceeds 20MB limit: {size_mb}MB'; print(f'Release ZIP verified: {len(names)} files, {size_mb:.2f}MB')"

  qgis-live-tests:
    # P1 fix, 2026-09-20 audit: no job in this workflow ever ran inside a real
    # QGIS process -- every check above runs with QGIS_AVAILABLE False. This
    # exercises the tests that specifically need real qgis.core/qgis.PyQt
    # bindings (test_chat_widget_live.py, test_plugin_main_live.py) inside the
    # official QGIS docker images.
    #
    # 2026-09-24: QGIS 3.x support dropped (Alaa: "keep the compatibility only for 4.2.2").
    # This job now runs QGIS 4.2.2 only. The dated notes below mention release-3_28
    # throughout; they are the history of how this job got its current shape and are left as
    # written. The pip --break-system-packages fallback in the next step existed for 3.28's
    # older pip and is now unused but harmless.
    #
    # Second-review correction, 2026-09-20: this job covers metadata.txt's
    # declared qgisMinimumVersion=3.28 floor and a current QGIS 4.x release --
    # NOT "the two ends" of the full 3.28-4.99 range. 4.2.2 is not the literal
    # upper bound (4.99), which doesn't correspond to any actual QGIS release
    # yet; it's the exact version this repo is developed/live-tested against
    # locally (see reference_local_qgis_installs). release-3_28 WAS, at that
    # point, not a pinned immutable version -- it was a moving branch tag that
    # tracked whatever the latest 3.28.x patch release currently was, confirmed
    # via the Docker Hub API (2026-09-20) to always be a real released 3.28
    # build, but one whose exact patch version could change under this same tag
    # name over time. That moving-tag behavior is exactly what the
    # fourth-review correction further below fixed by pinning to a digest --
    # this paragraph is a historical record of the reasoning at the time, not
    # this job's current pinning state; see that later comment for what's
    # actually in effect now. Deliberately NOT qgis/qgis:latest -- confirmed via the Docker Hub API
    # that `latest` and `nightly` currently share the same image digest, i.e.
    # `latest` is an unreleased dev build, not a stable QGIS version; using it
    # here would make results depend on whatever nightly happened to build
    # that day, not a reproducible QGIS release. If 4.2.2 stops being current,
    # update this tag deliberately rather than floating it back to `latest`.
    #
    # Validated 2026-09-20 against a real run (not just authored), then re-broken
    # by release-3_28's moving tag drifting to a new image with a fresh at-exit
    # crash trigger the same day.
    #
    # Fourth-review correction, 2026-09-20/21: pinned both images by immutable
    # manifest digest (via `repo@sha256:...`, not `repo:tag`) instead of a
    # floating tag -- release-3_28 moving underneath this job mid-session is
    # exactly the failure mode a digest pin exists to prevent. Digests below
    # captured from the Docker Hub API for tags 4.2.2 / release-3_28 on
    # 2026-09-20; re-resolve deliberately (not by switching back to a floating
    # tag) whenever a newer QGIS build is wanted here.
    name: QGIS live tests (${{ matrix.qgis_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2026-09-24: the release-3_28 entry was removed when QGIS 3.x support was dropped
          # (metadata.txt qgisMinimumVersion 3.28 -> 4.2). Its digest was
          # sha256:d109944e3ffedc9cc8e332fb8907afe309904ebb416dbea05e9671c9db7fdb36, kept here in
          # case 3.x support is ever reinstated. The matrix stays a matrix so a second 4.x image
          # can be added the same way.
          - qgis_label: "4.2.2"
            qgis_digest: "sha256:6ffe6b31646247f2e179cb2cc32bb4df215eedc99f387ad59a6cc88ebfe23e21"
    container:
      image: qgis/qgis@${{ matrix.qgis_digest }}
    # A throwaway PostGIS server for tests/test_postgis_live.py (audit F15, #151: execute_read_only_sql had never been run against a
    # database). Reached from the job container by its service name. Test credentials only; the container exists for this job and
    # nothing else.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: cartogen_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_TAG: ${{ matrix.qgis_label }}
      CARTOGEN_TEST_PG_HOST: postgis
      CARTOGEN_TEST_PG_PORT: "5432"
      CARTOGEN_TEST_PG_DATABASE: postgres
      CARTOGEN_TEST_PG_USER: postgres
      CARTOGEN_TEST_PG_PASSWORD: cartogen_ci
    steps:
      - uses: actions/checkout@v4

      - name: Install test-only Python dependencies
        # CI validation, 2026-09-20: two real, distinct failures found by actually
        # running this job against both images (not guessed).
        # (1) `pip install --upgrade pip` failed on the 4.2.2 image specifically:
        # its Debian-packaged pip has no RECORD file, so pip refuses to uninstall
        # itself to upgrade ("uninstall-no-record-file"). Dropped entirely -- the
        # preinstalled pip is fine for installing requirements, no upgrade needed.
        # (2) The two images disagree on --break-system-packages: 4.2.2's newer,
        # PEP-668-enforcing pip requires it; release-3_28's older pip doesn't
        # recognize the flag at all ("no such option") and errors immediately if
        # it's passed. Tried with the flag first, falls back without it on failure,
        # rather than hardcoding a choice that only works on one of the two images.
        run: |
          grep -v -E "^ultralytics|^#|^$" requirements.txt > /tmp/reqs.txt
          xargs -r python3 -m pip install --break-system-packages < /tmp/reqs.txt || \
          xargs -r python3 -m pip install < /tmp/reqs.txt

      - name: Minimal QGIS-only crash-isolation control (no plugin code)
        id: control
        # Fourth-review addition, 2026-09-20/21: this repo's own explanation for the
        # post-test segfault below (an environment/interpreter-teardown quirk, not a
        # plugin regression) was previously asserted, not demonstrated. This step
        # boots a real QgsApplication, creates and closes a couple of plain Qt
        # widgets, and exits -- tests/_ci_qgis_control_process.py never imports
        # cartogen_ai or anything from src/ at all. If THIS also segfaults with the
        # same signature, that's real evidence the crash is environment-level. The
        # step itself always exits 0 (diagnostic only, never fails the job by
        # itself) -- its outcome is what the next step's waiver actually checks.
        run: |
          set +e
          python3 tests/_ci_qgis_control_process.py > /tmp/control.log 2>&1
          status=$?
          cat /tmp/control.log
          if [ "$status" -eq 139 ] && grep -q "Segmentation fault" /tmp/control.log; then
            echo "same_crash=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Control process (no plugin code) reproduced the same exit-139/Segmentation-fault signature -- environment-level, not this repo's code."
          else
            echo "same_crash=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Control process exited $status without the segfault signature -- does NOT independently confirm the real test step's crash is environment-level."
          fi
          exit 0

      - name: Run live QGIS tests (real QgsApplication, real Qt widgets)
        # tests/_ci_run_live_tests.py runs the same tests.test_chat_widget_live +
        # tests.test_plugin_main_live modules `python3 -m unittest` would, but as a
        # script that can explicitly call QgsApplication.exitQgis() before process
        # exit -- unittest's own CLI entry point never does this, leaving Qt/QGIS's
        # C++ objects to whatever Python's implicit interpreter-exit teardown does
        # instead of an orderly exitQgis() call. See that script's own docstring.
        #
        # CI validation, 2026-09-20: a real run against the qgis/qgis:4.2.2 image
        # showed all 42 tests genuinely passing ("Ran 42 tests ... OK"), immediately
        # followed by "Segmentation fault (core dumped)" and exit code 139 -- a
        # crash during Python/Qt interpreter shutdown, AFTER the test run itself
        # already succeeded.
        #
        # Second-review correction, 2026-09-20: the first version of this waiver
        # accepted ANY nonzero exit alongside a bare "OK" line -- too broad, since
        # it didn't actually check for the specific known crash. Tightened to
        # require exit code exactly 139 (SIGSEGV), the literal "Segmentation
        # fault" message, AND unittest's own "OK" line -- initially ALSO scoped to
        # $QGIS_TAG == "4.2.2", on the assumption this was specific to that image.
        #
        # Third-review correction, 2026-09-20 (same day): that image-scoping was
        # wrong. release-3_28 -- which had NOT hit this before -- then failed with
        # the exact same signature on the very next run, root-caused to a
        # numpy/matplotlib ABI mismatch already present in that image's own
        # /usr/lib/python3/dist-packages (nothing this repo installs) plus a Qt
        # QBasicTimer/thread warning during shutdown -- a DIFFERENT trigger than
        # 4.2.2's, but the same "genuinely passed, then crashed at interpreter
        # exit" shape. Removed the $QGIS_TAG restriction.
        #
        # Fourth-review correction, 2026-09-20/21: the claimed root cause was
        # documented but never demonstrated or enforced by the waiver condition
        # itself, and explicit interpreter teardown had never actually been tried.
        # The waiver below is now conditioned on the PRECEDING control step's own
        # result, not asserted independently: exit 139 + "Segmentation fault" +
        # unittest's own "OK" line is necessary but no longer sufficient on its
        # own -- it ALSO requires the plugin-code-free control process to have
        # reproduced the identical signature this same run. If the control process
        # did NOT crash, this step fails for real instead of waiving, because that
        # combination is no longer confirmed to be environment-level.
        run: |
          set +e
          python3 -m tests._ci_run_live_tests > /tmp/live_test.log 2>&1
          status=$?
          cat /tmp/live_test.log
          if [ "$status" -eq 139 ] \
             && grep -q "Segmentation fault" /tmp/live_test.log \
             && grep -qE "^OK( \(skipped=[0-9]+\))?$" /tmp/live_test.log; then
            if [ "${{ steps.control.outputs.same_crash }}" = "true" ]; then
              echo "::warning::Confirmed known post-test interpreter-shutdown segfault on $QGIS_TAG (exit 139, 'Segmentation fault', after unittest's own 'OK', AND independently reproduced by the plugin-code-free control process this same run) -- not a test failure."
              exit 0
            else
              echo "::error::Live tests hit the exit-139/Segmentation-fault/OK signature, but the control process (no plugin code) did NOT reproduce it this run -- NOT treating as environment-level without that confirmation. Failing for real."
              exit $status
            fi
          fi
          exit $status

      - name: Build the actual release zip
        # Review correction, 2026-09-20: this smoke test previously imported plugin_main
        # straight from the checkout's own src/ tree, which proves the dev tree loads --
        # not that the packaged artifact a user actually installs does (plugin_upload.py's
        # EXCLUDE_DIRS/EXCLUDE_FILES could in principle drop something the plugin needs at
        # runtime without any of the tests above catching it). This does not replace the
        # still-open exact-ZIP clean-profile install test in
        # docs/IMPLEMENTATION_TRACKER.md §1.10 -- there's no fresh QGIS *profile* here, no
        # QGIS restart, and no upgrade-from-1.15.6 check -- but it closes the narrower gap
        # of "does the packaged zip's own file set actually import," which this smoke test
        # can check inside CI.
        run: python3 plugin_upload.py

      - name: Smoke-test plugin load -> unload -> reload against a real QgsApplication
        run: |
          mkdir -p /tmp/cartogen_ai_smoke
          python3 -c "import zipfile; zipfile.ZipFile('cartogen_ai.zip').extractall('/tmp/cartogen_ai_smoke')"
          python3 -c "
          import sys, os
          plugin_root = '/tmp/cartogen_ai_smoke/cartogen-ai'
          sys.path.insert(0, plugin_root)
          sys.path.insert(0, os.path.join(plugin_root, 'src'))
          from qgis.core import QgsApplication
          app = QgsApplication([], False)
          app.initQgis()
          import plugin_main
          class _Iface:
              def __init__(self, w): self._w = w
              def mainWindow(self): return self._w
              def addToolBarIcon(self, a): pass
              def removeToolBarIcon(self, a): pass
              def addPluginToMenu(self, n, a): pass
              def removePluginMenu(self, n, a): pass
              def addDockWidget(self, area, w): pass
              def removeDockWidget(self, w): pass
              def messageBar(self):
                  class _MB:
                      def pushWarning(self, *a, **k): pass
                      def pushMessage(self, *a, **k): pass
                  return _MB()
          from qgis.PyQt.QtWidgets import QMainWindow
          main_window = QMainWindow()
          p = plugin_main.CartogenAi(_Iface(main_window))
          p.initGui()
          p.unload()
          p2 = plugin_main.CartogenAi(_Iface(main_window))
          p2.initGui()
          p2.unload()
          print('plugin_main load->unload->reload smoke test OK')
          "
